<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OptiFine">
  <!-- 自绘：镜片 + 光圈叶片，取 OptiFine「看清更多细节」的意思 -->
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe3ff" />
      <stop offset="0.55" stop-color="#3aa6f0" />
      <stop offset="1" stop-color="#1b5fd0" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff" />
      <stop offset="1" stop-color="#9ec6e8" />
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 外圈金属环 -->
  <circle cx="32" cy="32" r="27" fill="url(#rim)" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#7fa8c8" stroke-width="1.5" />

  <!-- 镜片 -->
  <circle cx="32" cy="32" r="21" fill="url(#lens)" />

  <!-- 光圈叶片：六片，绕中心旋转 -->
  <g fill="#0d2f6b" fill-opacity="0.45">
    <path d="M32 32 L32 11 A21 21 0 0 1 50.2 21.5 Z" />
    <path d="M32 32 L50.2 21.5 A21 21 0 0 1 50.2 42.5 Z" />
    <path d="M32 32 L50.2 42.5 A21 21 0 0 1 32 53 Z" />
    <path d="M32 32 L32 53 A21 21 0 0 1 13.8 42.5 Z" />
    <path d="M32 32 L13.8 42.5 A21 21 0 0 1 13.8 21.5 Z" />
    <path d="M32 32 L13.8 21.5 A21 21 0 0 1 32 11 Z" />
  </g>

  <!-- 中心高光 + 边缘反光 -->
  <circle cx="32" cy="32" r="21" fill="url(#glow)" />
  <circle cx="32" cy="32" r="8" fill="#0a2148" fill-opacity="0.55" />
  <path d="M18 22 A17 17 0 0 1 30 15" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round" />

  <!-- 顶部小刻痕，和原版材质包图标区分开 -->
  <path d="M32 4.5 L34.2 10 L29.8 10 Z" fill="#9ec6e8" />
</svg>
